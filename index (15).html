<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Academy FY27 Master Tracker</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{
  --bg:#F2F5F8;--paper:#FFFFFF;--ink:#14243B;--muted:#56677D;--line:#D6DEE7;
  --moss:#0E7C7B;--moss-t:#DCF0EE;--blue:#2C5A88;--blue-t:#E2EAF4;
  --champ:#A9DDD8;--champ-t:#EDF2F7;--amber:#94650F;--amber-t:#FAEED3;
  --brick:#A3373A;--brick-t:#F7E0E1;--vio:#4744A3;--vio-t:#E7E6F6;
  --side:#13243B;--side-ink:#E6EDF5;--side-muted:#9DB0C6;--side-hi:#9ED8D2;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1622;--paper:#142030;--ink:#E5ECF4;--muted:#99AABE;--line:#26364B;
  --moss:#4FC2B9;--moss-t:#11312F;--blue:#8DB3DB;--blue-t:#192A3F;
  --champ:#2B6066;--champ-t:#18263A;--amber:#E4B967;--amber-t:#3A2D15;
  --brick:#EE9B95;--brick-t:#3E2022;--vio:#B6B4F2;--vio-t:#25244A;
  --side:#09111C;color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Sidebar */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 18px;display:flex;flex-direction:column;gap:14px}
.brand{padding:0 8px 6px}
.brand b{display:block;font-family:var(--serif);font-weight:650;font-size:21px;line-height:1.15}
.brand span{color:var(--side-muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:12px}
.nav h4{margin:0 8px 3px;font-size:12px;font-weight:600;color:var(--side-muted)}
.nav a{display:block;text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current=page]{background:var(--side-hi);color:#0B1A2E;font-weight:600}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:var(--side-muted)}
.side-foot button{width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid var(--side-muted);background:transparent;color:var(--side-ink);font-weight:600}
.menu-btn{display:none}

/* Main */
main{padding:28px 34px 60px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.head h1{font-family:var(--serif);font-weight:650;font-size:30px;line-height:1.15;margin:0}
.head p{margin:6px 0 0;color:var(--muted);max-width:72ch;font-size:14px}
.btn{padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--brick)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 0 12px}
.filters label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:3px}
.filters select,.filters input{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:150px}
.hint{font-size:13px;color:var(--muted)}

/* Grid tables */
.wrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table.grid{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.grid th{position:sticky;top:0;z-index:2;background:var(--champ-t);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:bottom;line-height:1.25}
.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top;background:var(--paper)}
.grid tr:hover td{background:color-mix(in srgb,var(--paper) 88%,var(--champ))}
.grid .sticky{position:sticky;left:0;z-index:1;font-weight:700;padding:8px 10px;white-space:nowrap;box-shadow:1px 0 0 var(--line)}
.grid th.sticky{z-index:3;background:var(--champ-t)}
.grid .ro{padding:8px 10px;white-space:nowrap;color:var(--muted)}
span.ro{display:block}
.calc{display:block;padding:8px 10px;white-space:nowrap;background:var(--champ-t);min-height:100%}
.grid td.calc-td{background:var(--champ-t)}
.w-l{min-width:230px}.w-t{min-width:150px}.w-d{min-width:142px}.w-s{min-width:138px}.w-n{min-width:96px}.w-m{min-width:112px}.w-c{min-width:118px}
.f{display:block;width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:8px 10px;margin:0;border-radius:0}
textarea.f{resize:vertical;min-height:37px;field-sizing:content;max-height:180px;line-height:1.4}
select.f{appearance:none;-webkit-appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.f:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--paper)}
[data-tone=good]{background-color:var(--moss-t);color:var(--moss)}
[data-tone=info]{background-color:var(--blue-t);color:var(--blue)}
[data-tone=warn]{background-color:var(--amber-t);color:var(--amber)}
[data-tone=bad]{background-color:var(--brick-t);color:var(--brick)}
[data-tone=mute]{color:var(--muted)}
.del{border:0;background:transparent;color:var(--brick);padding:8px 10px;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Dashboard */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.panel h2{font-family:var(--serif);font-weight:650;font-size:19px;margin:0 0 10px}
.panel h3{font-size:15px;margin:0 0 8px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{padding:6px 0;border-bottom:1px solid var(--line)}
.kv td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.kv tr:last-child td{border-bottom:0}

.year{position:relative;overflow-x:auto;padding:4px 0 2px}
.year-inner{position:relative;min-width:760px}
.ticks{display:grid;grid-template-columns:repeat(12,1fr);font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.bands{position:relative;height:40px;margin-top:24px}
.band{position:absolute;top:0;height:40px;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.band.p1{background:var(--blue-t);color:var(--blue)}
.band.p2{background:var(--vio-t);color:var(--vio)}
.band.p3{background:var(--moss-t);color:var(--moss)}
.band.p4{background:var(--amber-t);color:var(--amber)}
.marks{position:relative;margin-top:6px}
.mark{position:absolute;font-size:12px;line-height:1.25;padding-left:7px;border-left:2px solid var(--ink);white-space:nowrap}
.mark.right{transform:translateX(-100%);border-left:0;border-right:2px solid var(--ink);padding:0 7px 0 0;text-align:right}
.mark b{display:block}
.mark.past{opacity:.5}
.today{position:absolute;top:-8px;bottom:-6px;width:0;border-left:2px dashed var(--brick);z-index:2}
.today span{position:absolute;top:-17px;left:-4px;font-size:11.5px;font-weight:700;color:var(--brick);white-space:nowrap}
.next{margin-top:12px;font-size:14px}
.next strong{font-family:var(--serif);font-size:17px}

.cohort{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.tile{display:block;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.tile:hover{border-color:var(--muted)}
.tile .id{font-weight:700;font-size:13px}
.tile .nm{font-family:var(--serif);font-size:15px;line-height:1.25;margin:2px 0 8px;min-height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .nm.unnamed{color:var(--muted);font-family:var(--sans);font-size:13px;font-style:italic}
.chip{display:inline-block;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--champ-t)}
.meter{height:5px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--moss)}
.tile small{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{padding:8px 0 8px 12px;border-left:3px solid var(--line);margin-bottom:6px;font-size:14px}
.alerts li.bad{border-color:var(--brick)}.alerts li.warn{border-color:var(--amber)}.alerts li.ok{border-color:var(--moss)}
.alerts a{font-weight:600}
ol.gates{margin:0;padding-left:20px;font-size:14px}
ol.gates li{margin-bottom:6px;max-width:80ch}

/* Profile */
.prof-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.form .fld{background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 0 .5px var(--line)}
.form .fld>span{font-size:12px;color:var(--muted);padding:7px 10px 0}
.form .fld.wide{grid-column:1/-1}
.section{margin-top:22px}
.section h2{font-family:var(--serif);font-weight:650;font-size:19px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.section h2 a{font-family:var(--sans);font-size:13px;font-weight:600}

/* Dialog + toast */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:22px 24px}
dialog::backdrop{background:rgba(8,18,32,.5)}
dialog h2{font-family:var(--serif);margin:0 0 6px;font-size:22px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.dgrid .btn{text-align:left;padding:10px 12px}
.dgrid .btn small{display:block;font-weight:400;opacity:.8;font-size:12.5px;margin-top:2px}
.notice{background:var(--amber-t);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.prop{font-size:11.5px;font-weight:700;color:var(--amber);background:var(--amber-t);padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.libs{display:flex;flex-direction:column;gap:12px}
.lib{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lib.now{border-color:var(--moss);box-shadow:inset 4px 0 0 var(--moss)}
.lib-when{padding:16px 10px;text-align:center;border-right:1px solid var(--line);background:var(--champ-t)}
.lib-when span{display:block;font-family:var(--serif);font-weight:650;font-size:24px;line-height:1}
.lib-when small{color:var(--muted);font-size:12.5px}
.lib-when em{display:block;margin-top:8px;font-style:normal;font-size:11.5px;font-weight:700;color:var(--moss)}
.lib-body{padding:14px 18px 16px;min-width:0}
.lib-body h2{font-family:var(--serif);font-weight:650;font-size:20px;margin:0 0 4px}
.lib-body>p{margin:0 0 12px;color:var(--muted);font-size:14px;max-width:80ch}
.res-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.res{display:flex;flex-direction:column;gap:2px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;background:var(--paper)}
a.res:hover{border-color:var(--moss);background:var(--moss-t)}
.res small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.res.missing{border-style:dashed;background:transparent}
.res.missing b{color:var(--muted)}
.res code{font-size:11.5px}
.res .del{align-self:flex-start;padding:2px 0}
.lib details{margin-top:12px}
.lib summary{cursor:pointer;font-weight:600;font-size:14px}
.lib-det{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;font-size:14px}
.lib-det h3{font-size:13px;margin:10px 0 2px}.lib-det h3:first-child{margin-top:0}
.lib-det p,.lib-det ol{margin:0}.lib-det ol{padding-left:18px}
.doclist{margin:0;padding-left:18px;font-size:14px}.doclist li{margin-bottom:6px}
.addres{display:flex;flex-direction:column;gap:8px}
.addres label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:3px}
.addres input,.addres select{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
@media (max-width:700px){.lib{grid-template-columns:1fr}.lib-when{border-right:0;border-bottom:1px solid var(--line);text-align:left;display:flex;gap:8px;align-items:baseline}.lib-det{grid-template-columns:1fr}}
.calbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:4px}
.calh{font-family:var(--serif);font-weight:650;font-size:22px;margin:0 6px;min-width:190px;text-align:center}
.calnote{margin:4px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px;font-size:13px}
.lg{display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--champ-t);font-size:12.5px;font-weight:600;padding:6px 8px}
.day{background:var(--paper);min-height:112px;padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.day.out{background:color-mix(in srgb,var(--paper) 70%,var(--bg))}.day.out .dn span{color:var(--muted);opacity:.6}
.day.today-cell .dn span{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 7px}
.dn{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.dn .add{border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;padding:0 4px;border-radius:4px;opacity:0}
.day:hover .add,.add:focus-visible{opacity:1}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:2px 6px;font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{font-weight:700}
.more{border:0;background:transparent;font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:0 4px}
.ev-learn{background:var(--moss-t);color:var(--moss);border-left:3px solid var(--moss)}
.ev-peer{background:var(--blue-t);color:var(--blue);border-left:3px solid var(--blue)}
.ev-coach{background:var(--vio-t);color:var(--vio);border-left:3px solid var(--vio)}
.ev-cop{background:var(--champ-t);color:var(--ink);border-left:3px solid var(--ink)}
.ev-dead{background:var(--brick-t);color:var(--brick);border-left:3px solid var(--brick)}
.ev-act{background:var(--amber-t);color:var(--amber);border-left:3px solid var(--amber)}
.lg.ev-learn,.lg.ev-peer,.lg.ev-coach,.lg.ev-cop,.lg.ev-dead,.lg.ev-act{border-left-width:3px}
.agenda section{margin-bottom:14px}.agenda h3{font-size:14px;margin:0 0 6px}
.agi{display:flex;gap:14px;width:100%;text-align:left;border:0;border-radius:6px;padding:8px 12px;margin-bottom:5px;font-size:14px}
.agi .agt{min-width:92px;font-weight:600}.agi small{display:block;font-size:12.5px;opacity:.85}
.uplist{list-style:none;margin:0;padding:0;font-size:14px}.uplist li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}.uplist li:last-child{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none;border-left:0!important;background:currentColor!important}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.evgrid label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.evgrid .wide{grid-column:1/-1}
.evgrid input,.evgrid select,.evgrid textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.evgrid .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13.5px}
@media (max-width:700px){.day{min-height:64px}.ev{font-size:0;height:7px;padding:0}.ev .t{display:none}.evgrid{grid-template-columns:1fr}.calh{min-width:0;font-size:18px}}
@media print{.day{min-height:90px}.ev{white-space:normal}}
.stamp{display:inline-block;margin:-6px 0 12px;font-size:12.5px;color:var(--muted);background:var(--champ-t);border-radius:5px;padding:2px 8px}
.copyline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}.copyline code{background:var(--champ-t);padding:6px 10px;border-radius:6px;font-size:13px;flex:1;min-width:240px}
.rules{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 26px 18px;max-width:820px}
.rules section{border-bottom:1px solid var(--line);padding:12px 0}.rules section:last-child{border-bottom:0}
.rules h2{font-family:var(--serif);font-weight:650;font-size:19px;margin:4px 0 6px}
.rules ul{margin:4px 0;padding-left:20px}.rules li{margin-bottom:4px}
.rules-t td{vertical-align:top;padding:9px 0}.rules-t .hint{font-size:13px}
@media print{.rules{border:0;padding:0}.prop{border:1px solid #999}}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.subtabs a{text-decoration:none;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--moss)}
.formcell{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 8px}
.formcell .btn{padding:4px 10px;font-size:12.5px}.formcell .f{padding:4px 2px;font-size:12.5px;border-bottom:1px dashed var(--line)}
.fname{font-size:12.5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbcomments{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.fbcomments h3{font-size:14px;margin:0 0 4px}.fbcomments ul{margin:0;padding-left:18px;font-size:14px}
.qedit{display:flex;flex-direction:column;gap:6px;max-width:860px}
.qrow{display:flex;gap:8px;align-items:center}.qrow .qn{width:22px;font-weight:700;color:var(--muted)}
.qrow input,.qrow select{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.qrow input{flex:1}
.w-multi{min-width:260px}.w-choice{min-width:270px}

.bdn{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.stage{text-align:center;font-weight:700}
.stage[data-stage="1"]{background:var(--brick-t);color:var(--brick)}.stage[data-stage="2"]{background:var(--amber-t);color:var(--amber)}
.stage[data-stage="3"]{background:var(--blue-t);color:var(--blue)}.stage[data-stage="4"]{background:var(--moss-t);color:var(--moss)}
.fbres td.ro{white-space:normal;min-width:110px;font-size:12.5px}
.qbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.qsub{flex-wrap:wrap;margin-top:6px;padding-left:30px;align-items:flex-start}
.qsub label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.qsub label.grow{flex:1;min-width:260px}.qsub textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.qsub label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px;padding-top:16px}
.gprogs{display:flex;flex-direction:column;gap:16px}
.gprog{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px}
.gprog header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.gprog .chip{max-width:none}
.gprog h2{font-family:var(--serif);font-weight:650;font-size:18px;margin:0}.gprog h2 a{text-decoration:none}
.gcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}

.gtop select.f{width:auto;border:1px solid var(--line);border-radius:6px;padding:3px 24px 3px 8px;font-size:12.5px}

.gf .f,.gf .calc{border:1px solid var(--line);border-radius:6px;background-color:var(--paper);color:var(--ink);font-size:13.5px;padding:6px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.glib{font-size:12.5px;font-weight:600;margin-top:-2px}
.gev{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gev .btn{padding:4px 10px;font-size:12.5px}
.gev .f{border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:12.5px;padding:4px 8px;flex:1;min-width:150px}
.gdet summary{cursor:pointer;font-size:13px;font-weight:600}.gdet .gf{margin-top:6px}
.gbig{font-size:15px;margin:0}.gbig strong{font-family:var(--serif);font-size:30px}
@media (max-width:1000px){.gcards{grid-template-columns:1fr}}
@media print{.gdet{display:none}.gcard{break-inside:avoid}}
.bk{display:block;width:100%;text-align:left;margin-top:6px;padding:6px 8px;border-radius:6px;border:0;font-size:12.5px;line-height:1.35;background:rgba(255,255,255,.06);color:var(--side-ink)}

.demobar .btn{padding:5px 11px}

ol.tour a:hover{border-color:var(--moss)}

@media (max-width:900px){

<aside class="side" id="side">

    <button class="btn" data-act="safeJson">Download safe-share data.json<small>Names, contacts, notes and payments removed</small></button>

  }
  const setup={}; SETUP_ROWS.forEach(r=>setup[r[0]]=r[3]);
  setup.mode="plan"; setup.planN=20; setup.finalN=""; setup.rule={...DEFAULT_RULE};
  return {meta:{version:1,updated:null,source:"Blank template"},setup,s,library:[],events:[],fbq:DEFAULT_FBQ.map(q=>({...q,options:q.options?[...q.options]:undefined})),fbr:{}};

function normalize(d){ // make sure an imported/backup object has every sheet and row
  const b=blankData(); if(!d||typeof d!=="object"||!d.s) return b;
  for(const k of Object.keys(S)){
    if(S[k].kind==="dyn"&&!Array.isArray(d.s[k])) continue;
    const src=Array.isArray(d.s[k])?d.s[k]:[];
    if(S[k].kind==="dyn") b.s[k]=src.filter(r=>r&&typeof r==="object").map(r=>k==="exp"&&r.C?{...r,C:fundName(r.C)}:r);
    else if(k==="fund") b.s[k]=b.s[k].map((row,i)=>{const m=src.find(x=>x&&fundName(x.A)===row.A)||(src[i]&&!FUND_ALIASES[src[i].A]&&!FUND_ROWS.some(f=>f[0]===src[i].A)?src[i]:null);const o=Object.assign({},row,m||{});o.A=row.A;return o;});
    else b.s[k]=b.s[k].map((row,i)=>{const o=Object.assign({},row,src[i]||{});o.A=row.A;if(S[k].kind==="month"||S[k].kind==="goal")o.C=row.C;return o;});
  }
  b.setup=Object.assign(b.setup,d.setup||{});
  b.setup.rule=Object.assign({...DEFAULT_RULE},b.setup.rule||{}); delete b.setup.tiers;
  if(b.setup.mode==="roster") b.setup.mode="live";
  if(!["plan","live","final"].includes(b.setup.mode)) b.setup.mode="plan";
  b.meta=Object.assign(b.meta,d.meta||{});
  b.fbq=Array.isArray(d.fbq)?d.fbq.filter(q=>q&&q.id):b.fbq;
  if(b.fbq.map(q=>q.id).join(",")===OLD_FBQ_IDS) b.fbq=DEFAULT_FBQ.map(q=>({...q,options:q.options?[...q.options]:undefined})); b.fbr=(d.fbr&&typeof d.fbr==="object")?d.fbr:{};
  b.events=Array.isArray(d.events)?d.events.filter(x=>x&&x.date&&EV_TYPES[x.type]):[];
  b.library=Array.isArray(d.library)?d.library.filter(x=>x&&typeof x==="object"):[];
  return b;
}

function compute(){

  const R=Object.assign({...DEFAULT_RULE},st.rule||{}); ["full","fullAt","step","min","max"].forEach(k=>R[k]=num(R[k]));
  const contractFor=n=>n<R.min?0:(n>=R.fullAt?R.full:R.full-R.step*(R.fullAt-n));
  const preDone=IDS.filter((id,i)=>s.pre[i].L==="Completed"||s.asmt[i].C==="Completed").length;
  const clamp=n=>Math.max(0,Math.min(R.max,Math.round(num(n))));
  const N=st.mode==="live"?Math.min(R.max,preDone):st.mode==="final"?clamp(st.finalN):clamp(st.planN);
  const contract=contractFor(N);
  const sched=[]; for(let n=R.min;n<=R.max;n++){const amt=contractFor(n);sched.push({n,amt,red:R.full-amt,stip:n*stipend,ops:amt-n*stipend,act:n===N?"Current":""});}
  const T0=todayISO();

    tier:N<R.min?`Below the ${R.min}-provider minimum`:N>=R.fullAt?`Full contract (${R.fullAt}–${R.max} providers)`:`${R.fullAt-N} below ${R.fullAt}, ${money(R.step*(R.fullAt-N))} reduction`,
    below:N<R.min, pastCutoff:T0>st[17], final:st.mode==="final"};
  const credited=v=>v==="Attended"||v==="Made up"?1:0;
  const C={};
  C.roster=s.roster.map(()=>({}));
  const inactive=i=>nm(i)===""||["Declined","Withdrawn"].includes(s.roster[i].K);

    N:(r.K==="Completed"&&r.M==="Completed")?"Ready":(T>st[16]?"Overdue":"In progress"),
    O:(r.L==="Completed"&&r.K==="Completed")?"Ready":(T>st[17]?"Overdue":"In progress")}));
  C.onb=s.onb.map((r,i)=>({B:nm(i),M:nm(i)===""?"":((r.C==="Completed"&&r.D==="Completed"&&r.F==="Completed"&&r.J==="Completed")?"Eligible":"Not yet")}));
  C.att=s.att.map((r,i)=>{const H=credited(r.D)+credited(r.E)+credited(r.F);const I=UNPAID_MONTHS.includes(r.C)?0:H*per;return {B:nm(Math.floor(i/10)),H,I,M:Math.max(0,I-num(r.K))};});
  C.coach=s.coach.map((r,i)=>({B:nm(Math.floor(i/10))}));
  C.bud=s.bud.map((r,i)=>({B:nm(Math.floor(i/10)),J:(blankish(r.H)||blankish(r.I))?"":num(r.H)-num(r.I)}));
  C.vssn=s.vssn.map((r,i)=>({B:nm(Math.floor(i/10))}));

      G:s.bud.filter(b=>b.C===m&&b.F==="Yes").length,H:C.att.filter((x,i)=>s.att[i].C===m).reduce((a,x)=>a+x.I,0),

    actuals:s.bud.filter(b=>b.F==="Yes").length, implemented, practiceMet:practiceSummary().met, practicePool:practiceSummary().total, post:s.asmt.filter(r=>r.E==="Completed").length,

let saveTimer=null;
function save(){
  if(DEMO){setSaveState();return;}
  D.meta.updated=new Date().toISOString();
  try{localStorage.setItem(STORE_KEY,JSON.stringify(D));setSaveState();}
  catch(e){$("#saveState").textContent="Couldn’t save in this browser. Download a backup now.";}
}
function scheduleSave(){clearTimeout(saveTimer);$("#saveState").textContent="Saving…";saveTimer=setTimeout(save,350);}
function setSaveState(){
  if(DEMO){const bl=document.getElementById("bkWrap");if(bl)bl.innerHTML="";$("#saveState").textContent="Sample walkthrough: nothing is saved";return;}
  const u=D.meta.updated?new Date(D.meta.updated):null;
  const bl=document.getElementById("bkWrap"); if(bl) bl.innerHTML=typeof backupLine==="function"?backupLine():"";
  $("#saveState").textContent=u?("Saved in this browser "+u.toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+u.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})):"Blank tracker, nothing entered yet";
}
async function boot(){
  let raw=null; try{raw=localStorage.getItem(STORE_KEY);}catch(e){}
  if(raw){try{D=normalize(JSON.parse(raw));}catch(e){D=blankData();}}
  else{const shared=await fetchShared(); if(shared){D=normalize(shared);D.meta.source="Shared data.json";}}
  CMP=compute(); buildNav(); setSaveState(); render();
}
async function fetchShared(){
  if(location.protocol==="file:") return null;
  try{const r=await fetch("data.json",{cache:"no-store"}); if(!r.ok) return null; return await r.json();}catch(e){return null;}
}
function replaceData(d,source){D=normalize(d);D.meta.source=source;CMP=compute();save();render();}

/* ---------- Controls ---------- */
function typeAt(k,i,col){
  if(k==="fund"&&i===0&&col.c==="B") return "c$";
  return col.type;
}
function control(k,i,col,opts={}){
  const t=typeAt(k,i,col), row=D.s[k][i], v=row[col.c];
  const attrs=`data-k="${k}" data-i="${i}" data-c="${col.c}" data-t="${t}" aria-label="${esc(col.label)}${row.A?" for "+esc(row.A):""}"`;
  if(t==="c"||t==="c$"){const cv=CMP[k][i][col.c];return `<span class="calc" data-calc="${k}|${i}|${col.c}" data-t="${t}" ${t==="c"?`data-tone="${tone(cv)}"`:""}>${esc(t==="c$"?money(cv):cv)}</span>`;}
  if(t==="id"||t==="ro") return `<span class="ro">${esc(v)}</span>`;
  if(t.startsWith("s:")){const list=L[t.slice(2)];const extra=(!blankish(v)&&!list.includes(v))?`<option selected>${esc(v)}</option>`:"";
    return `<select class="f" ${attrs} data-tone="${tone(v)}"><option value=""></option>${extra}${list.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select>`;}
  if(t==="d") return `<input class="f" type="date" ${attrs} value="${esc(v)}">`;
  if(t==="n") return `<input class="f" type="number" step="any" ${attrs} value="${esc(v)}">`;
  if(t==="$") return `<input class="f" type="number" step="0.01" inputmode="decimal" ${attrs} value="${esc(v)}" placeholder="$">`;
  if(t==="l") return `<textarea class="f" rows="1" ${attrs}>${esc(v)}</textarea>`;
  return `<input class="f" type="text" ${attrs} value="${esc(v)}">`;
}
const widthClass = t => t==="l"?"w-l":t==="d"?"w-d":t.startsWith("s:")?"w-s":t==="n"?"w-n":t==="$"?"w-m":(t==="c"||t==="c$")?"w-c":t==="ro"||t==="id"?"":"w-t";
function cellTd(k,i,col){
  const t=typeAt(k,i,col);
  if(t==="id") return `<td class="sticky">${esc(D.s[k][i].A)}</td>`;
  if(k==="fund"&&col.c==="A") return `<td class="sticky" style="font-weight:600;white-space:normal;min-width:240px">${esc(D.s[k][i].A)}</td>`;
  if(S[k].kind==="months"&&col.c==="A") return `<td class="sticky">${esc(D.s[k][i].A)}</td>`;
  return `<td class="${widthClass(t)}${t==="c"||t==="c$"?" calc-td":""}">${control(k,i,col)}</td>`;
}
function refreshCalcs(){
  document.querySelectorAll("[data-calc]").forEach(el=>{

function timeline(){
  const st=D.setup, start=parseISO("2026-10-01"), end=parseISO("2027-09-30"), span=end-start;
  const pos=iso=>Math.min(100,Math.max(0,(parseISO(iso)-start)/span*100));
  const ticks=["Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep"];
  const bands=[["p1","Recruitment","2026-10-01",st[17]],["p2","Onboarding",st[18],"2026-12-31"],["p3","Monthly engagement, paid Jan–Aug","2027-01-01","2027-08-31"],["p4","Completion","2027-09-01",st[19]]];
  const ms=[[st[15],"Interest due"],[st[16],"Regional packet due"],[st[17],"VECF cutoff"],[st[18],"Kickoff"],[st[19],"Program end"]].filter(m=>m[0]).sort((a,b)=>a[0]<b[0]?-1:1);
  const lanes=[]; const T=todayISO();
  const marks=ms.map(([d,label])=>{const p=pos(d);const right=p>82;let lane=0;
    while(lanes[lane]!==undefined && (right?false:p-lanes[lane]<14)) lane++;
    lanes[lane]=p;
    return `<div class="mark${right?" right":""}${d<T?" past":""}" style="left:${p}%;top:${lane*36}px"><b>${esc(fmtDate(d).replace(/, \d{4}$/,""))}</b>${esc(label)}</div>`;}).join("");
  const tp=pos(T); const inRange=T>="2026-10-01"&&T<="2027-09-30";
  const next=ms.find(m=>m[0]>=T);
  const nextTxt=next?(()=>{const n=daysUntil(next[0]);return `<div class="next">Next milestone: <strong>${esc(next[1])}</strong>, ${esc(fmtDate(next[0]))} (${n===0?"today":n===1?"tomorrow":"in "+n+" days"})</div>`;})():`<div class="next">All FY27 milestones have passed.</div>`;
  return `<div class="year" role="img" aria-label="FY27 program year timeline from October 2026 to September 2027"><div class="year-inner">
    <div class="ticks">${ticks.map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="bands">${bands.map(([c,l,a,b])=>`<div class="band ${c}" style="left:${pos(a)}%;width:${Math.max(0,pos(b)-pos(a))}%" title="${esc(l)}">${esc(l)}</div>`).join("")}
      ${inRange?`<div class="today" style="left:${tp}%"><span>Today</span></div>`:""}</div>
    <div class="marks" style="height:${Math.max(1,lanes.length)*36+4}px">${marks}</div>
  </div></div>${nextTxt}`;
}

function alerts(){
  const d=CMP.dash, out=[];
  if(d.overduePre) out.push(["bad",`${d.overduePre} program${d.overduePre>1?"s are":" is"} past a pre-enrollment deadline.`,"pre","Review pre-enrollment"]);
  const T=todayISO(), pmNow=MONTH_YM.indexOf(T.slice(0,7));
  if(pmNow>=0){const cs=coachSchedStatus(pmNow), day=+T.slice(8,10);
    if(cs.total&&cs.done<cs.total&&day>=COACH_SCHED_DAY-5){const late=day>COACH_SCHED_DAY;
      out.push([late?"bad":"warn",`${cs.total-cs.done} of ${cs.total} programs ${late?"missed":"still need"} a ${MONTHS[pmNow]} 1:1 scheduled with the BA Lead ${late?"by":"before"} the ${COACH_SCHED_DAY}th: ${cs.missing.join(", ")}.`,"coach","Open coaching log"]);}}
  if(pmNow>=0){const m=MONTHS[pmNow],fs=fbMonthStats(m),day=+T.slice(8,10);
    if(day>=FB_SEND_DAY&&fs.notSent.length) out.push(["warn",`Send the ${m} feedback form to ${fs.notSent.length} program${fs.notSent.length>1?"s":""} (due the ${FB_DUE_DAY}th).`,"asmt-feedback","Open feedback"]);
    const fq=(D.fbq||[]).find(q=>q.followup);
    if(fq){const want=[];MONTHS.forEach(mm=>IDS.forEach(id=>{const r=fbRec(id,mm);if(fbAns(r,fq)==="Yes"&&!r.discussed)want.push(`${id} (${mm.split(" ")[0]})`);}));
      if(want.length) out.push(["warn",`Asked to discuss their feedback results: ${want.join(", ")}.`,"asmt-feedback","Open feedback"]);}
    if(fs.overdue.length) out.push(["bad",`${m} feedback forms overdue: ${fs.overdue.join(", ")}.`,"asmt-feedback","Open feedback"]);}
  if(T>="2027-06-01"){const ps=practiceSummary();const miss=[...ps.evid,...ps.none];if(ps.total&&miss.length)out.push([T>="2027-08-01"?"bad":"warn",`${miss.length} program${miss.length>1?"s haven’t":" hasn’t"} met the business practice requirement yet: ${miss.join(", ")}.`,"goals","Open goals"]);}
  {const b=backupState(); if(b.level!=="ok"&&b.hasData) out.push([b.level,b.lb?`Last backup was ${b.days} days ago${b.filesStale?", and new uploaded files aren’t in a zip yet":""}.`:b.filesStale&&b.lb?"New uploaded files aren’t in a zip backup yet.":"This tracker hasn’t been backed up yet.","","" ]);}
  const unnot=D.s.chg.filter(x=>x.D==="Withdrawal"&&x.H!=="Yes");
  if(unnot.length) out.push(["bad",`${unnot.length} withdrawal${unnot.length>1?"s have":" has"} not been reported to VECF yet (${unnot.map(x=>x.C||x.A).join(", ")}).`,"chg","Open log"]);
  const wd=D.s.roster.filter(r=>r.K==="Withdrawn"&&!D.s.chg.some(x=>x.C===r.A&&x.D==="Withdrawal")).map(r=>r.A);
  if(wd.length) out.push(["warn",`${wd.join(", ")} marked Withdrawn on the roster with no withdrawal logged.`,"chg","Log withdrawal"]);
  const fbn=D.s.fb.filter(x=>x.I!=="Yes").length;
  if(fbn) out.push(["warn",`${fbn} Budgeting Tool feedback item${fbn>1?"s":""} not yet shared with VECF.`,"fb","Open feedback"]);
  const sc=CMP.scn;
  if(sc.below) out.push(["bad",`Contract basis is ${sc.N} provider${sc.N===1?"":"s"}, below the ${D.setup.rule.min}-provider minimum.`,"contract","Adjust enrollment"]);
  if(sc.pastCutoff&&!sc.final) out.push(["warn","The November 30 VECF cutoff has passed. Lock the final enrolled count.","contract","Lock count"]);
  if(sc.enrolled!==sc.preDone&&(sc.enrolled||sc.preDone)) out.push(["warn",`${sc.enrolled} marked Enrolled or Pre-assessment complete on the roster, but ${sc.preDone} have the VECF pre-assessment marked Completed on Pre-enrollment or Assessments. VECF counts pre-assessments.`,"pre","Review pre-enrollment"]);
  if(d.hiRisk) out.push(["bad",`${d.hiRisk} open high or critical risk${d.hiRisk>1?"s":""}.`,"risk","Open risks"]);
  if(d.unpaid>0) out.push(["warn",`${money(d.unpaid)} in earned stipends not yet recorded as paid.`,"stip","Check stipends"]);
  const over=CMP.fund.filter(f=>f.E!==""&&f.E<0).length;
  if(over) out.push(["bad",`${over} budget categor${over>1?"ies are":"y is"} over the approved amount.`,"fund","Open fund allocation"]);
  const noStatus=D.s.roster.filter(r=>!blankish(r.B)&&blankish(r.K)).length;
  if(noStatus) out.push(["warn",`${noStatus} named program${noStatus>1?"s have":" has"} no enrollment status.`,"roster","Update roster"]);
  const m=currentMonth(), mi=MONTHS.indexOf(m);
  const missed=D.s.att.filter((r,i)=>i%10===mi&&[r.D,r.E,r.F].includes("Missed")).length;
  if(missed) out.push(["warn",`${missed} program${missed>1?"s":""} missed an activity in ${m}. Make-ups need approval.`,"att","Open attendance"]);
  if(!out.length) out.push(["ok","Nothing flagged right now.","",""]);
  out.forEach(o=>{if(o[0]!=="ok"&&o[2]===""&&/backup|backed up|zip/.test(o[1]))o[3]="__bk";});
  return `<ul class="alerts">${out.map(([c,t,h,l])=>`<li class="${c}">${esc(t)}${l==="__bk"?` <a href="#dashboard" data-bknow>Back up now</a>`:h?` <a href="#${h}">${esc(l)}</a>`:""}</li>`).join("")}</ul>`;
}

const FormStore={
  db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no idb"));const q=indexedDB.open("ba-fy27-feedback-forms",1);q.onupgradeneeded=()=>q.result.createObjectStore("files");q.onsuccess=()=>{this.db=q.result;res(this.db);};q.onerror=()=>rej(q.error);});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("files",mode);const st=t.objectStore("files");const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});},
  put(k,blob){return this.tx("readwrite",s=>s.put(blob,k));},
  get(k){return this.tx("readonly",s=>s.get(k));},
  del(k){return this.tx("readwrite",s=>s.delete(k));}
};

function allEvents(){
  const out=[], ev=D.events||[];

  const has=(type,date,prog)=>ev.some(e=>e.type===type&&e.date===date&&(!prog||e.prog===prog));
  const st=D.setup;
  [[15,"Regional interest deadline"],[16,"Regional paperwork deadline"],[17,"VECF enrollment cutoff (pre-assessments)"],[18,"Program kickoff"],[19,"Program end"]]
    .forEach(([r,t])=>{if(st[r]&&!has("deadline",st[r]))out.push({id:"m"+r,date:st[r],type:"deadline",title:t,goto:"setup"});});
  D.s.sess.forEach((r,i)=>{
    if(r.C&&!has("learn",r.C)) out.push({id:"sl"+i,date:r.C,type:"learn",title:"Learning Group: "+(r.B||""),loc:r.D?("Facilitator: "+r.D):"",goto:"sess"});
    if(r.G&&!has("peer",r.G)) out.push({id:"sp"+i,date:r.G,type:"peer",title:"Peer Connections"+(r.H?": "+r.H:""),loc:r.I?("Facilitator: "+r.I):"",goto:"sess"});});
  MONTHS.forEach((m,pmI)=>{const fs=fbMonthStats(m);
    out.push({id:"fs"+pmI,date:fbSendDate(m),type:"activity",title:"Send monthly feedback form",notes:`Send the ${m} feedback form to every program. Due back by the ${FB_DUE_DAY}th.`,goto:"asmt-feedback",gotoM:m});
    out.push({id:"fd"+pmI,date:fbDue(m),type:"deadline",title:"Feedback forms due"+(fs.total?` (${fs.recv}/${fs.total})`:""),notes:`Completed ${m} feedback forms are due today.`,goto:"asmt-feedback",gotoM:m});});
  MONTH_YM.forEach((ym,pmI)=>{const st2=coachSchedStatus(pmI);
    out.push({id:"cs"+pmI,date:ym+"-"+pad(COACH_SCHED_DAY),type:"deadline",title:`Due: 1:1s scheduled w/ BA Lead`+(st2.total?` (${st2.done}/${st2.total})`:""),
      notes:`Every program’s ${MONTHS[pmI]} 1:1 coaching session should be scheduled with the BA Lead by the ${COACH_SCHED_DAY}th.`,goto:"coach",gotoM:MONTHS[pmI]});});
  D.s.coach.forEach((r,i)=>{if(r.D&&!has("coach",r.D,r.A))out.push({id:"c"+i,date:r.D,type:"coach",prog:r.A,title:"1:1 coaching",goto:"coach",gotoP:r.A});});

  return out.filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.date)).sort((a,b)=>(a.date+(a.start||"00:00")).localeCompare(b.date+(b.start||"00:00")));

    else D.events=D.events.filter(x=>x.id!==e.id);

  $("#evForm").onsubmit=ev2=>{ev2.preventDefault();
    const v={type:$("#evType").value,date:$("#evDate").value,start:$("#evStart").value,end:$("#evEnd").value,title:$("#evTitle").value.trim(),

      if(rep&&until>v.date){dates=[];const d0=parseISO(v.date);const nth=Math.ceil(d0.getDate()/7), wd=d0.getDay();
        for(let k=0;k<80;k++){let d;

function exportICS(){
  const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Foundation First//Business Academy FY27//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:Business Academy FY27"];
  allEvents().forEach(e=>{const d=e.date.replace(/-/g,"");
    lines.push("BEGIN:VEVENT","UID:"+e.id+"-"+d+"@ba-fy27","DTSTAMP:"+stamp);
    if(e.start){lines.push("DTSTART:"+d+"T"+e.start.replace(":","")+"00");lines.push("DTEND:"+d+"T"+(e.end||e.start).replace(":","")+"00");}
    else{const n=new Date(parseISO(e.date));n.setDate(n.getDate()+1);lines.push("DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+isoOf(n).replace(/-/g,""));}
    lines.push("SUMMARY:"+icsEsc(evLabel(e)),"CATEGORIES:"+icsEsc(EV_TYPES[e.type].label));
    if(e.loc)lines.push("LOCATION:"+icsEsc(e.loc)); if(e.notes)lines.push("DESCRIPTION:"+icsEsc(e.notes));
    lines.push("END:VEVENT");});
  lines.push("END:VCALENDAR");
  download(`Business_Academy_FY27_calendar_${todayISO()}.ics`,new Blob([lines.join("\r\n")],{type:"text/calendar"}));
  toast("Calendar file downloaded. Open it to add the dates to Outlook.");
}

/* ---------- Safe-share export and backup tracking ---------- */
const SAFE_STRIP={roster:"BCHINOP",pre:"PQR",onb:"O",att:"KLNO",coach:"IJKLPQ",bud:"HILMN",vssn:"FGHIJ",goals:"EFGJLMNO",asmt:"JKL",close:"MNOP",stip:"DOT",exp:"EJKM",risk:"DGH",chg:"EKL",lead:"BLMN",fb:"K"};
function safeCopy(){
  const d=JSON.parse(JSON.stringify(D));
  for(const [k,cols] of Object.entries(SAFE_STRIP)) (d.s[k]||[]).forEach(r=>{
    if(k==="goals"&&goalHasEvidence(r)) r.ev=true;
    cols.split("").forEach(c=>{delete r[c];}); delete r.evFile;});
  const fq=d.fbq||[];
  Object.values(d.fbr||{}).forEach(r=>{delete r.file;delete r.link;delete r.notes;
    fq.forEach(q=>{if(q.type==="text"&&r.answers)delete r.answers[q.id];if(r.answers)delete r.answers[q.id+"_note"];});});
  (d.events||[]).forEach(e=>{delete e.loc;delete e.notes;});
  d.meta.safe=true; d.meta.source="Safe-share data.json"; d.meta.lastBackup=null; d.meta.lastFilesBackup=null;
  return d;
}
function markFilesBackup(){const hasF=Object.values(D.fbr||{}).some(r=>r.file),hasE=(D.s.goals||[]).some(r=>r.evFile);
  const okF=!hasF||D.meta.fbZipAt, okE=!hasE||D.meta.evZipAt; if(okF&&okE){const t=[hasF?D.meta.fbZipAt:"",hasE?D.meta.evZipAt:""].filter(Boolean).sort()[0];if(t)D.meta.lastFilesBackup=t;}save();setSaveState();}
function fileCount(){let n=0,latest="";
  Object.values(D.fbr||{}).forEach(r=>{if(r.file){n++;if(r.file.added>latest)latest=r.file.added;}});
  (D.s.goals||[]).forEach(r=>{if(r.evFile){n++;if(r.evFile.added>latest)latest=r.evFile.added;}});
  return {n,latest};}
function backupState(){
  const lb=D.meta.lastBackup, now=Date.now(), days=lb?Math.floor((now-new Date(lb))/86400000):null;
  const fc=fileCount(), filesStale=fc.n>0&&(!D.meta.lastFilesBackup||fc.latest>D.meta.lastFilesBackup);
  const hasData=!!D.meta.updated&&!D.meta.safe&&!DEMO;
  let level="ok"; if(hasData&&(days===null||days>=14))level="bad"; else if(hasData&&days>=7)level="warn"; if(filesStale&&level==="ok")level="warn";
  return {lb,days,filesStale,files:fc.n,level,hasData};
}
function backupLine(){
  const b=backupState(); if(!b.hasData&&!b.files) return "";
  const t=b.lb?`Last backup ${new Date(b.lb).toLocaleDateString("en-US",{month:"short",day:"numeric"})}${b.days===0?" (today)":b.days===1?" (yesterday)":` (${b.days} days ago)`}`:"No backup yet";
  return `<button type="button" class="bk bk-${b.level}" id="bkLine">${esc(t)}${b.filesStale?"<br>New uploaded files not in a zip yet":""}${b.level!=="ok"?"<br><u>Back up now</u>":""}</button>`;
}
async function backupAll(){
  D.meta.lastBackup=new Date().toISOString();save();
  download(`BA_FY27_tracker_backup_${todayISO()}.json`,new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));
  const fc=fileCount();
  if(fc.n){await new Promise(r=>setTimeout(r,400));const okF=Object.values(D.fbr||{}).some(r=>r.file);const okE=(D.s.goals||[]).some(r=>r.evFile);
    if(okF)await fbZip(); if(okE){await new Promise(r=>setTimeout(r,400));await evZip();}
    D.meta.lastFilesBackup=new Date().toISOString();save();}
  setSaveState();
  toast(fc.n?"Backup and file zips downloaded. Save them to your SharePoint backup folder.":"Backup downloaded. Save it to your SharePoint backup folder.");
}

/* ---------- Excel import / export ---------- */
const serialToISO = n => {const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());};
const isoToSerial = iso => {const [y,m,d]=iso.split("-").map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000;};
function readCell(ws,addr,t){
  const cell=ws[addr]; if(!cell||cell.v==null||cell.v==="") return "";
  if(t==="d"){if(cell.t==="n")return serialToISO(cell.v);const s=String(cell.v).trim();const p=new Date(s);return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:(isNaN(p)?s:p.getFullYear()+"-"+pad(p.getMonth()+1)+"-"+pad(p.getDate()));}
  if(t==="n"||t==="$"||t==="pct"){const n=Number(cell.v);return isNaN(n)?String(cell.v):n;}
  return typeof cell.v==="string"?cell.v:String(cell.w??cell.v);
}
$("#fileXlsx").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(!window.XLSX){toast("The Excel reader didn’t load. Check your internet connection and reload.");return;}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:false});
    const nd=blankData(); const found=[];
    const ws0=wb.Sheets["SETUP"];
    if(ws0){found.push("SETUP");SETUP_ROWS.forEach(([r,,t])=>{const v=readCell(ws0,"B"+r,t);if(v!=="")nd.setup[r]=v;});
      const lab={"FULL CONTRACT AMOUNT":"full","FULL AMOUNT STARTS AT (PROVIDERS)":"fullAt","REDUCTION PER PROVIDER":"step","MINIMUM COHORT":"min","MAXIMUM COHORT":"max"};
      for(let r=24;r<70;r++){const a=readCell(ws0,"A"+r,"t");
        if(lab[a]){const n=readCell(ws0,"B"+r,"n");if(typeof n==="number")nd.setup.rule[lab[a]]=n;}
        if(a==="COUNT MODE"){const m=readCell(ws0,"B"+r,"t");nd.setup.mode=["plan","live","final"].includes(m)?m:"plan";}
        if(a==="PLANNING NUMBER"){const n=readCell(ws0,"B"+r,"n");if(typeof n==="number")nd.setup.planN=n;}
        if(a==="FINAL ENROLLED COUNT"){const n=readCell(ws0,"B"+r,"n");if(typeof n==="number")nd.setup.finalN=n;}}}
    for(const [k,sp] of Object.entries(S)){
      const ws=wb.Sheets[sp.xl]; if(!ws) continue; found.push(sp.xl);
      const inputCols=sp.cols.filter(c=>!["id","ro","c","c$"].includes(c.type));
      if(sp.kind==="dyn"){ nd.s[k]=[];
        for(let r=6;r<6+sp.max+200;r++){const row={};let any=false;
          for(const c of inputCols){const v=readCell(ws,c.c+r,c.type);if(v!==""){row[c.c]=v;any=true;}}
          if(any){if(k==="exp"&&row.C)row.C=fundName(row.C);nd.s[k].push(row);}}
      } else {
        if(k==="fund"){for(let r=6;r<6+FUND_ROWS.length;r++){const nm=fundName(readCell(ws,"A"+r,"t"));let i=FUND_ROWS.findIndex(f=>f[0]===nm);if(i<0)i=r-6;const row=nd.s.fund[i];
            for(const c of inputCols){if(i===0&&c.c==="B")continue;const v=readCell(ws,c.c+r,c.type);if(v!=="")row[c.c]=v;}}}
        else nd.s[k].forEach((row,i)=>{for(const c of inputCols){const v=readCell(ws,c.c+(6+i),c.type);if(v!=="")row[c.c]=v;}});
      }
    }
    const wsQ=wb.Sheets["FEEDBACK QUESTIONS"], wsF=wb.Sheets["MONTHLY FEEDBACK"];
    if(wsQ){const qs=[];for(let r=4;r<100;r++){const id=readCell(wsQ,"A"+r,"t");if(!id)break;const ty=readCell(wsQ,"C"+r,"t");const yes=c=>readCell(wsQ,c+r,"t")==="Yes";
        const opts=readCell(wsQ,"D"+r,"t");qs.push({id,text:readCell(wsQ,"B"+r,"t"),type:FBQ_TYPES[ty]?ty:"text",options:opts?opts.split("|").map(x=>x.trim()).filter(Boolean):undefined,note:yes("E"),scale:yes("F"),followup:yes("G"),short:readCell(wsQ,"H"+r,"t")});}
      if(qs.length)nd.fbq=qs;}
    if(wsF){const F=fbFields(nd.fbq), col=i=>XLSX.utils.encode_col(i), nf=F.length;
      for(let r=6;r<6+200;r++){const id=readCell(wsF,"A"+r,"t"),m=readCell(wsF,"C"+r,"t");if(!IDS.includes(id)||!MONTHS.includes(m))continue;
        const rec={answers:{}};const sent=readCell(wsF,"D"+r,"d"),recv=readCell(wsF,"E"+r,"d");if(sent)rec.sent=sent;if(recv)rec.recv=recv;
        F.forEach((f,j)=>{let v=readCell(wsF,col(6+j)+r,f.t);if(v==="")return;if(f.multi)v=String(v).split(";").map(x=>x.trim()).filter(Boolean);rec.answers[f.k]=v;});
        const disc=readCell(wsF,col(6+nf)+r,"d"),link=readCell(wsF,col(8+nf)+r,"t"),notes=readCell(wsF,col(9+nf)+r,"t");if(disc)rec.discussed=disc;if(link)rec.link=link;if(notes)rec.notes=notes;
        const prevFile=(D.fbr[fbKey(id,m)]||{}).file;if(prevFile)rec.file=prevFile;
        if(rec.sent||rec.recv||Object.keys(rec.answers).length||rec.link||rec.notes||rec.file||rec.discussed)nd.fbr[fbKey(id,m)]=rec;}}
    const wsC=wb.Sheets["CALENDAR"];
    if(wsC){const lab=Object.fromEntries(Object.entries(EV_TYPES).map(([k,t])=>[t.label,k]));
      for(let r=6;r<2000;r++){const date=readCell(wsC,"A"+r,"d");if(!date)break;
        nd.events.push({id:"x"+r+"_"+Date.now(),date,start:readCell(wsC,"B"+r,"t"),end:readCell(wsC,"C"+r,"t"),type:lab[readCell(wsC,"D"+r,"t")]||"activity",
          title:readCell(wsC,"E"+r,"t"),prog:readCell(wsC,"F"+r,"t"),loc:readCell(wsC,"G"+r,"t"),notes:readCell(wsC,"H"+r,"t"),series:readCell(wsC,"I"+r,"t")});}}
    if(found.length<3) throw new Error("layout");
    if(confirm(`Found ${found.length} of ${Object.keys(S).length+1} data tabs in “${f.name}”. Replace the data in this browser with this workbook?`)){
      nd.meta.tabs={}; nd.meta.imported=new Date().toISOString(); replaceData(nd,"Excel "+f.name); dlg.close(); toast(`Imported ${found.length} tabs from Excel`);}
  }catch(err){console.error(err);toast("Couldn’t read that workbook. Use the Business Academy master tracker layout (.xlsx).");}
});
function exportXlsx(){
  if(!window.XLSX){toast("The Excel writer didn’t load. Check your internet connection and reload.");return;}
  const wb=XLSX.utils.book_new(); const dateCells=[];
  const addSheet=(name,aoa,widths,dateMap)=>{
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    (dateMap||[]).forEach(a=>{if(ws[a]&&typeof ws[a].v==="number")ws[a].z="mmm d, yyyy";});
    ws["!cols"]=widths.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,name);};
  const val=(k,i,c)=>{const t=typeAt(k,i,c);if(t==="c"||t==="c$")return CMP[k][i][c.c];const v=D.s[k][i][c.c];if(t==="d"&&v&&/^\d{4}-\d{2}-\d{2}$/.test(v))return isoToSerial(v);return v??"";};
  // Setup
  const setupAoa=[["PROGRAM SETTINGS • APPROVAL & POLICY"],[],["Yellow-highlighted policy fields require regional approval before provider communications."],[],["Setting","Value","How used / policy note"]];
  const sd=[]; SETUP_ROWS.forEach(([r,l,t,,n])=>{let v=D.setup[r];if(t==="d"&&v){v=isoToSerial(v);sd.push("B"+r);}setupAoa.push([l,v,n]);});
  const RR=D.setup.rule;
  setupAoa[7]=["Contract amount (current enrollment)",CMP.scn.contract,"VECF FY27 guidance: $115,000 for 16–20 providers; $2,500 less per provider below 16, down to $95,000 for 8"];
  setupAoa.push([],["CONTRACT FUNDING RULE"],["FULL CONTRACT AMOUNT",num(RR.full)],["FULL AMOUNT STARTS AT (PROVIDERS)",num(RR.fullAt)],["REDUCTION PER PROVIDER",num(RR.step)],["MINIMUM COHORT",num(RR.min)],["MAXIMUM COHORT",num(RR.max)],
    ["COUNT MODE",D.setup.mode,CMP.scn.mode],["PLANNING NUMBER",num(D.setup.planN)],["FINAL ENROLLED COUNT",D.setup.finalN===""?"":num(D.setup.finalN)],[],["Providers","Contract amount"],...CMP.sched.map(r=>[r.n,r.amt]));
  addSheet("SETUP",setupAoa,[34,16,70],sd);
  for(const [k,sp] of Object.entries(S)){
    const ci=c=>c.c.charCodeAt(0)-65, width=Math.max(...sp.cols.map(ci))+1;
    const byLetter=f=>{const a=new Array(width).fill("");sp.cols.forEach(c=>a[ci(c)]=f(c));return a;};
    const aoa=[[sp.xl],[],[sp.note],[],byLetter(c=>c.label)]; const dm=[];
    D.s[k].forEach((row,i)=>{aoa.push(byLetter(c=>{const v=val(k,i,c);if(c.type==="d"&&typeof v==="number")dm.push(c.c+(6+i));return v;}));});
    if(k==="fund"){const fs=CMP.fundSum;aoa.push([],[],["Funding / control","Amount"],["VECF contract",fs.contract],["Approved allocations",fs.alloc],["Unallocated contract funding",fs.unalloc],["Actual spent to date",fs.spent]);}
    addSheet(sp.xl,aoa,[...sp.cols].sort((a,b)=>ci(a)-ci(b)).map(c=>c.type==="l"?36:c.type==="id"||c.type==="ro"?(k==="fund"?40:12):Math.max(14,Math.min(28,c.label.length+2))),dm);
  }
  { const Q=D.fbq||[], F=fbFields(Q); const hdr=["Program ID","Program name","Month","Sent","Received","Status",...F.map(f=>f.h),"Discussed on","Form file","Form link","Notes"];
    const rowsF=[],dmF=[]; IDS.forEach(id=>MONTHS.forEach(m=>{const r=fbRec(id,m);const rn=6+rowsF.length;
      if(r.sent)dmF.push("D"+rn); if(r.recv)dmF.push("E"+rn); if(r.discussed)dmF.push(XLSX.utils.encode_col(6+F.length)+rn);
      rowsF.push([id,progName(id),m,r.sent?isoToSerial(r.sent):"",r.recv?isoToSerial(r.recv):"",fbStatus(id,m),...F.map(f=>{const v=(r.answers||{})[f.k];return Array.isArray(v)?v.join("; "):(v??"");}),r.discussed?isoToSerial(r.discussed):"",r.file?r.file.name:"",r.link||"",r.notes||""]);}));
    addSheet("MONTHLY FEEDBACK",[["MONTHLY FEEDBACK FORMS"],[],[`Sent on the ${FB_SEND_DAY}th, due on the ${FB_DUE_DAY}th. Check-all answers are separated by semicolons. Uploaded files are not included; use Download all forms on the website.`],[],hdr,...rowsF],[10,24,10,13,13,13,...F.map(f=>f.w),13,24,30,30],dmF);
    addSheet("FEEDBACK QUESTIONS",[["FEEDBACK FORM QUESTIONS"],[],["Question ID","Question","Answer type (choice, multi, text, yesno, rating)","Options (separated by |)","Notes box","Stages in order","Yes means follow up","Short label"],...Q.map(q=>[q.id,q.text,q.type,(q.options||[]).join(" | "),q.note?"Yes":"",q.scale?"Yes":"",q.followup?"Yes":"",q.short||""])],[12,60,26,60,10,12,14,24]); }
  addSheet("CALENDAR",[["BUSINESS ACADEMY CALENDAR"],[],["Items added on the website calendar. Dates from Session calendar, Coaching log and Setup are not repeated here."],[],["Date","Start","End","Type","Title","Program ID","Location / link","Notes","Series"],
    ...(D.events||[]).map(e=>[isoToSerial(e.date),e.start||"",e.end||"",EV_TYPES[e.type].label,e.title||"",e.prog||"",e.loc||"",e.notes||"",e.series||""])],[14,8,8,24,40,10,30,40,12],(D.events||[]).map((e,i)=>"A"+(6+i)));
  addSheet("HOW TO USE",[["BUSINESS ACADEMY FY27 • MASTER TRACKER GUIDE"],[],["Start with PROGRAM ROSTER and SETUP. All twenty IDs link across the tracker. Workbook contains suggested policies, not official approval."],[],["When","Sheet(s)","What to do","Decision / evidence","Owner"],...HOWTO],[20,34,60,56,18]);
  const d=CMP.dash, st=D.setup;
  const ms=[["Interest due",st[15]],["Regional packet due",st[16]],["VECF deadline",st[17]],["Start",st[18]],["End",st[19]]];
  const ki=[["Planned program slots",d.slots],["Programs named",d.named],["Enrolled",d.enrolled],["Pending enrollment",d.pending],["Official pre-assessments complete",d.preAsmt],["Onboarding ready",d.onbReady],["Learning activities credited",d.learn],["Peer activities credited",d.peer],["1:1 activities credited",d.one],["Actuals updated (provider-months)",d.actuals],["Business improvements implemented",d.implemented],["Post-assessments complete",d.post]];
  const fi=[["VECF contract (current tier)",d.contract],["Proposed per-provider stipend",d.stipend],["Maximum stipends for programs counted",d.maxStip],["Maximum remaining operations",d.maxRemain],["Allocated operating budget",d.allocOps],["Unallocated contract funds",d.unalloc],["Expenses recorded",d.expenses],["Monthly stipend earned",d.monthlyEarned],["Enrolled/incentive earned",d.enrollEarned],["Closing incentives eligible",d.closingElig],["Total earned stipend",d.totalEarned],["Unpaid earned stipend",d.unpaid]];
  const da=[["BUSINESS ACADEMY | FY27 • 20-PROGRAM DASHBOARD"],[],["Recruitment → Onboarding → Monthly Engagement → Financial Performance → Completion"],[],["KEY INDICATOR","VALUE","","STIPEND / FUNDING","VALUE","","MILESTONES","DATE"]];
  const ddm=[];
  for(let r=0;r<12;r++){const m=ms[r];const mv=m&&m[1]?isoToSerial(m[1]):"";if(m&&m[1])ddm.push("H"+(6+r));da.push([ki[r][0],ki[r][1],"",fi[r][0],fi[r][1],"",m?m[0]:"",mv]);}
  da.push([],[],["IMPORTANT CONTROLS / DECISION GATES"],...gates().map((g,i)=>[(i+1)+". "+g]));
  addSheet("DASHBOARD",da,[36,12,3,32,14,3,22,14],ddm);
  XLSX.writeFile(wb,`Business_Academy_FY27_Master_Tracker_export_${todayISO()}.xlsx`);
  toast("Excel export downloaded");
}
